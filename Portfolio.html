<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #2ecc71;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #333;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }
    section {
      padding: 20px;
    }
    .gallery img {
      width: 200px;
      margin: 10px;
      border-radius: 10px;
    }
    .contact input, .contact textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }
    .contact button {
      background: #2ecc71;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 10px;
      background: #333;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>My Portfolio</h1>
  <p>Welcome to my personal website</p>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#gallery">Gallery</a>
  <a href="#contact">Contact</a>
</nav>

<section id="about">
  <h2>About Me</h2>
  <p>Hello! I'm a creative person. You can put your description here.</p>
</section>

<section id="gallery">
  <h2>My Pictures</h2>
  <div class="gallery">
    <img src="C:\Users\leome\OneDrive\Pictures\Camera Roll\leomer" alt="Picture 1">
    <img src="image2.jpg" alt="Picture 2">
    <img src="image3.jpg" alt="Picture 3">
  </div>
</section>

<section id="contact">
  <h2>Contact Me</h2>
  <div class="contact">
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
